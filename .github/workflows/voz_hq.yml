name: voz_hq
on:
  push:
    branches: [main]
    paths: ['tts_hq/**']
permissions:
  contents: write
concurrency:
  group: voz_hq
  cancel-in-progress: false
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/mente_tts
          key: voz-hq-v1
      - name: Instalar Chatterbox (CPU)
        run: |
          mkdir -p inbox/logs
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          (pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && \
           pip install -q chatterbox-tts soundfile huggingface_hub pandas pyarrow) > inbox/logs/voz_hq_install.txt 2>&1 || (tail -50 inbox/logs/voz_hq_install.txt; exit 0)
          pip show chatterbox-tts torch | grep -E "Name|Version" >> inbox/logs/voz_hq_install.txt
      - name: Generar voces
        run: python -P kit/tts_hq.py 2>&1 | tee inbox/logs/voz_hq_run.txt
      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name "mente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -c 20000 inbox/logs/voz_hq_install.txt > /tmp/i.txt && mv /tmp/i.txt inbox/logs/voz_hq_install.txt || true
          git add inbox
          git commit -m "inbox: voces naturales" || exit 0
          git pull --rebase
          git push
